name: checks

on:
  push:
  pull_request:

jobs:
  harness-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # CPU-only PyTorch so the model, training and allocator tests run too (skipped without torch).
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - name: Definition of done (tests, notebooks, harness drift, links, size/secrets, immutability)
        env:
          # PRs are compared with their base branch; pushes with the previous commit.
          HARNESS_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '') }}
        run: python harness/check.py
