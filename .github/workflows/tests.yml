name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Notebooks are valid and output-free
        run: |
          python - <<'EOF'
          import glob, nbformat
          for path in glob.glob("notebooks/**/*.ipynb", recursive=True):
              nb = nbformat.read(path, as_version=4)
              nbformat.validate(nb)
              assert not any(c.get("outputs") for c in nb.cells if c.cell_type == "code"), path
              print("ok", path)
          EOF
